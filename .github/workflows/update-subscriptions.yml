name: Update Subscriptions

on:
  schedule:
    - cron: "0 * * * *"  # Every hour
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./sub-builder/config-sub-platform
        run: pip install -r requirements.txt

      - name: Run subscription pipeline
        working-directory: ./sub-builder/config-sub-platform
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: python main.py

      - name: Copy generated files to main repo
        run: |
          mkdir -p generated
          cp -r sub-builder/config-sub-platform/generated/* generated/ 2>/dev/null || true

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add generated/
          git diff --staged --quiet || git commit -m "chore: update subscriptions [skip ci]"
          git push
