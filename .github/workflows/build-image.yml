name: Build OpenWrt Image (Cudy WR3000S v1)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Firmware version tag'
        required: true
        default: 'v1.0.0'
      profile:
        description: 'Target profile'
        required: true
        default: 'cudy_wr3000s-v1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bison build-essential ccache clang curl coreutils file flex g++ g++-multilib gawk gcc-multilib genisoimage gettext git git-core gosu libdw-dev libelf-dev libncurses5-dev libssl-dev locales pv pwgen python3 python3-cryptography python3-pip python3-pyelftools python3-setuptools python3-venv qemu-utils rsync signify-openbsd subversion swig unzip wget zlib1g-dev zstd jq axel
          # Ensure GNU install is available
          sudo ln -sf /usr/bin/install /usr/local/bin/ginstall
          sudo ln -sf /usr/bin/install /usr/local/bin/install

      - name: Download and extract OpenWrt ImageBuilder
        run: |
          VERSION="24.10.5"
          TARGET="mediatek/filogic"
          FILE_HOST="https://downloads.openwrt.org"
          DOWNLOAD_PATH="$FILE_HOST/releases/$VERSION/targets/$TARGET"
          
          wget -nv "$DOWNLOAD_PATH/sha256sums" -O sha256sums
          
          file_name=$(grep "imagebuilder-.*x86_64.tar" sha256sums | cut -d "*" -f 2 | head -1)
          echo "Downloading: $file_name"
          
          axel -q -n8 "$DOWNLOAD_PATH/$file_name"
          sha256sum -c <(grep "$file_name" sha256sums)
          
          tar xf "$file_name" --strip=1 --no-same-owner -C .
          rm -f "$file_name" sha256sums
          
          echo "ImageBuilder extracted to $(pwd)"

      - name: Create repositories.conf
        run: |
          cat > repositories.conf << 'EOF'
          src/gz openwrt_core https://downloads.openwrt.org/releases/24.10.5/targets/mediatek/filogic/packages
          src/gz openwrt_base https://downloads.openwrt.org/releases/24.10.5/packages/aarch64_cortex-a53/base
          src/gz openwrt_luci https://downloads.openwrt.org/releases/24.10.5/packages/aarch64_cortex-a53/luci
          src/gz openwrt_packages https://downloads.openwrt.org/releases/24.10.5/packages/aarch64_cortex-a53/packages
          src/gz openwrt_routing https://downloads.openwrt.org/releases/24.10.5/packages/aarch64_cortex-a53/routing
          src/gz openwrt_telephony https://downloads.openwrt.org/releases/24.10.5/packages/aarch64_cortex-a53/telephony
          EOF

      - name: Build OpenWrt Image
        run: |
          set -o pipefail
          INSTALL=/usr/bin/install make image \
            PROFILE="cudy_wr3000s-v1" \
            PACKAGES="tachyon tachyon-core luci-app-tachyon luci-i18n-tachyon-ru zram-swap -wireguard-tools -ppp -ppp-mod-pppoe -kmod-nft-offload" \
            EXTRA_IMAGE_NAME="v1.0.0" \
            BIN_DIR="${{ github.workspace }}/artifacts/bin" \
            FORCE=1 \
            2>&1 | tee build.log

      - name: Copy config files to image
        run: |
          mkdir -p ${{ github.workspace }}/artifacts/files/etc/config
          cp ${{ github.workspace }}/configs/tachyon.config ${{ github.workspace }}/artifacts/files/etc/config/tachyon
          cp ${{ github.workspace }}/configs/network.config ${{ github.workspace }}/artifacts/files/etc/config/network
          cp ${{ github.workspace }}/configs/firewall.config ${{ github.workspace }}/artifacts/files/etc/config/firewall
          cp ${{ github.workspace }}/configs/dhcp.config ${{ github.workspace }}/artifacts/files/etc/config/dhcp

      - name: Upload firmware to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: firmware-${{ github.event.inputs.version }}
          name: "OpenWrt ${{ github.event.inputs.version }} for Cudy WR3000S v1"
          body: |
            Прошивка для Cudy WR3000S v1 (MT7986) с предустановленным Tachyon.

            Включает:
            - Tachyon core + luci-app-tachyon + ru i18n
            - zram-swap для оптимизации памяти
            - Предустановленные конфиги (Direct_RU, Desync, VPN)

            Установка через sysupgrade.
          files: |
            artifacts/bin/targets/mediatek/filogic/*.bin
            artifacts/bin/targets/mediatek/filogic/*.itb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}