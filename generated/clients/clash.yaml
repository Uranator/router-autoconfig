    url: "https://www.gstatic.com/generate_204"
    interval: 60
    tolerance: 50
    proxies:
      - "VPS-Reality"
      - "VPS-Hysteria2"
      - "VPS-SS2022"
  - name: "DIRECT"
    type: select
    proxies:
      - "DIRECT"
  - name: "BLOCK"
    type: select
    proxies:
      - "REJECT"
rules:
  - "GEOIP,CN,DIRECT"
  - "GEOSITE,CN,DIRECT"
  - "MATCH,VPS"